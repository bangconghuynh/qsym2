<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.css"
  integrity="sha384-v4Umc4sheYROVDLXMfTI+etiSNKChUsMFcoNxZ6GEV8DLjKkrg7i2GN9Rb2wufWy"
  crossorigin="anonymous"
/>

<!-- The loading of KaTeX is deferred to speed up page rendering -->
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"
  integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk"
  crossorigin="anonymous"
></script>

<!-- To automatically render math in text elements, include the auto-render extension: -->
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js"
  integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
  crossorigin="anonymous"
  onload="renderMathInElement(document.body)"
></script>
<script>
  "use strict";
  document.addEventListener("DOMContentLoaded", function () {
    var maths = document.getElementsByClassName("language-math");
    for (var i = 0; i < maths.length; i++) {
      var el = maths[i];
      katex.render(el.innerText, el, { displayMode: true });
    }

    var codes = document.getElementsByTagName("code");
    for (i = 0; i < codes.length; i++) {
      el = codes[i];
      if (el.classList.contains("language-math")) continue;
      if (el.classList.contains("language-inline-math")) {
        katex.render(el.innerText, el);
        continue;
      }

      var parent = el.parentNode;
      if (parent.nodeName.toLowerCase() === "pre") continue;
      // TODO: Can this be done with DOM manipulation rather than string manipulation?
      // https://stackoverflow.com/q/48438067/3019990
      var inlineMath = "$" + el.outerHTML + "$";
      if (parent.innerHTML.indexOf(inlineMath) !== -1) {
        el.classList.add("language-inline-math");
        parent.innerHTML = parent.innerHTML.replace(
          "$" + el.outerHTML + "$",
          el.outerHTML,
        );
        i--;
      }
    }
  });
</script>
